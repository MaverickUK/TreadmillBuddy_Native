# Build the firmware and run the host-side tests on every push and pull
# request. A tag vX.Y.Z also publishes a GitHub release with the UF2s, after
# checking that the tag matches FIRMWARE_VERSION in src/version.h.
name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: test/run_native_tests.sh

  build:
    name: Firmware
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e pico_28 -e pico_114

      - name: Read the firmware version
        id: version
        run: |
          version=$(sed -n 's/.*FIRMWARE_VERSION "\(.*\)".*/\1/p' src/version.h)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Firmware version $version"

      - name: Check the tag matches the firmware version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match FIRMWARE_VERSION ${{ steps.version.outputs.version }} in src/version.h"
            exit 1
          fi

      - name: Name the UF2 files
        run: |
          mkdir dist
          cp .pio/build/pico_28/firmware.uf2 "dist/treadmillbuddy-display28-v${{ steps.version.outputs.version }}.uf2"
          cp .pio/build/pico_114/firmware.uf2 "dist/treadmillbuddy-display114-v${{ steps.version.outputs.version }}.uf2"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-v${{ steps.version.outputs.version }}
          path: dist/*.uf2

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware-v${{ needs.build.outputs.version }}
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.uf2 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

; Treadmill Buddy firmware (C++ / Arduino-Pico) for a Raspberry Pi Pico with
; a Pimoroni Pico Display Pack.
;
;   pio run                       build for the 2.0"/2.8" pack -> .pio/build/pico_28/firmware.uf2
;   pio run -e pico_114           build for the original 1.14" pack
;   pio run -t upload             build + flash over USB (BOOTSEL or auto-reset)
;   pio device monitor            serial console (115200)

[platformio]
default_envs = pico_28                ; plain `pio run` builds and flashes only this

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico                       ; RP2040
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0
; 125 MHz so the LCD's SPI runs at exactly clk_sys / 2 = 62.5 MHz (at the
; default 133 MHz the nearest SPI rate is 33 MHz, halving the frame rate).
board_build.f_cpu = 125000000L
; How the board names itself over USB while the firmware runs (the IDs stay
; Raspberry Pi's, so uploads keep working).
board_build.arduino.earlephilhower.usb_manufacturer = Treadmill Buddy
board_build.arduino.earlephilhower.usb_product = TREADMILLBUDDY
monitor_speed = 115200
; Uploads over USB (debugging) wait up to 1.5 s at boot for the serial
; console; every other build, including GitHub's, doesn't. See the script.
extra_scripts = post:scripts/serial_wait.py
build_flags =
    -O2
    -Wall

; Pico Display Pack 2.0" / 2.8" (320x240)
[env:pico_28]
build_flags =
    ${env.build_flags}
    -DDISPLAY_PACK=28

; Pico Display Pack 1.14" (240x135)
[env:pico_114]
build_flags =
    ${env.build_flags}
    -DDISPLAY_PACK=114
